name: Shyraq CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: shyraq-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Secret and environment audit
        run: |
          set -e
          if git grep -nE 'NEXT_PUBLIC_[A-Z0-9_]*(SERVICE|SECRET|PRIVATE)|NEXT_PUBLIC_SUPABASE_(SERVICE_ROLE|SECRET)|NEXT_PUBLIC_SERVICE_ROLE_KEY' -- ':!package-lock.json' ':!.github/**'; then
            echo "Potential browser-exposed privileged Supabase secret detected."
            exit 1
          fi
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$'; then
            echo "A non-example environment file is tracked."
            exit 1
          fi
          echo "Static secret/environment audit passed."

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: API smoke test
        run: npm run test:api
