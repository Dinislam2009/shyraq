name: Shyraq CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: shyraq-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Secret and environment audit
        run: |
          set -e
          if git grep -nE 'NEXT_PUBLIC_[A-Z0-9_]*(SERVICE|SECRET|PRIVATE)|NEXT_PUBLIC_SUPABASE_(SERVICE_ROLE|SECRET)|NEXT_PUBLIC_SERVICE_ROLE_KEY' -- ':!package-lock.json' ':!.github/**'; then
            echo "Potential browser-exposed privileged Supabase secret detected."
            exit 1
          fi
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$'; then
            echo "A non-example environment file is tracked."
            exit 1
          fi
          echo "Static secret/environment audit passed."

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle audit
        run: npm run audit:bundle
      - name: Accessibility audit
        run: npm run audit:aria
      - name: Page performance audit
        run: npm run audit:performance

      - name: API smoke test
        run: npm run test:api
      - name: Install Playwright runner
        run: npm install --no-save --no-package-lock @playwright/test@1.63.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser E2E
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
