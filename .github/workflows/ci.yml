name: Shyraq CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and sync lockfile
        run: npm install

      - name: Commit lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: sync package lockfile"
            git push
          fi

      - name: Secret and environment audit
        run: |
          set -e
          if git grep -nE 'NEXT_PUBLIC_[A-Z0-9_]*(SERVICE|SECRET|PRIVATE)|SUPABASE_(SERVICE_ROLE|SECRET)|SERVICE_ROLE_KEY' -- ':!package-lock.json' ':!.github/**'; then
            echo "Potential browser-exposed privileged Supabase secret detected."
            exit 1
          fi
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$'; then
            echo "A non-example environment file is tracked."
            exit 1
          fi
          echo "Static secret/environment audit passed."

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
