name: Shyraq CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - name: Lint
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee /tmp/shyraq-lint.log
      - name: Report lint diagnostics
        if: steps.lint.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('/tmp/shyraq-lint.log', 'utf8');
            const trimmed = output.length > 60000 ? output.slice(-60000) : output;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 2,
              body: "### Temporary CI lint output\n\n~~~text\n" + trimmed + "\n~~~"
            });
      - name: Build
        id: build
        run: npm run build
      - name: Final CI result
        if: always()
        run: |
          if [ "${{ steps.lint.outcome }}" = "failure" ] || [ "${{ steps.build.outcome }}" = "failure" ]; then
            exit 1
          fi
